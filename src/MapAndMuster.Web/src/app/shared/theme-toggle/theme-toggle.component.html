<button
  type="button"
  class="theme-toggle"
  [attr.aria-pressed]="theme.isDark()"
  [attr.aria-label]="theme.isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
  (click)="toggle()"
>
  <app-icon [name]="theme.isDark() ? 'moon' : 'sun'" />
  <span>{{ theme.isDark() ? 'Switch to light mode' : 'Switch to dark mode' }}</span>
</button>
