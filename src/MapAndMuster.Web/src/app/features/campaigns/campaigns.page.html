<section class="page">
  <div class="page-header">
    <h1>Your campaigns</h1>
    <a class="button" routerLink="/campaigns/new">Create campaign</a>
  </div>

  @if (error()) {
    <p class="error error-banner" role="alert">{{ error() }}</p>
  }

  @if (loading()) {
    <p>Loading campaigns…</p>
  } @else if (campaigns().length === 0) {
    <div class="panel stack">
      <p>You are not managing or participating in any campaigns yet.</p>
      <p class="muted">Create a campaign to set factions, player slots, and a map.</p>
    </div>
  } @else {
    <app-campaign-list [campaigns]="campaigns()" [allowDuplicate]="true" (membershipChanged)="reload()" />
  }
</section>
