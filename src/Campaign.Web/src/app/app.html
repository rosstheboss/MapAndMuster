<div class="app-shell" [attr.inert]="submitOverlay.busy() ? '' : null">
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="app-banner">
    <a routerLink="/" class="app-brand">
      <app-icon name="castle" />
      Campaign Map
    </a>
    <app-theme-toggle />
  </header>
  <nav class="app-menubar" aria-label="Main">
    <a routerLink="/" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }" class="nav-link">
      <app-icon name="home" />
      Home
    </a>
    <a routerLink="/campaigns" routerLinkActive="is-active" class="nav-link">
      <app-icon name="map" />
      Your Campaigns
    </a>
    <a routerLink="/profile" routerLinkActive="is-active" class="nav-link">
      <app-icon name="helm" />
      Profile
    </a>
    @if (auth.currentUser(); as user) {
      <span class="nav-user">{{ user.username }}</span>
      <button type="button" class="nav-link nav-button" (click)="logout()" [disabled]="loggingOut()">
        <app-icon name="logout" />
        Log out
      </button>
    } @else {
      <a routerLink="/login" routerLinkActive="is-active" class="nav-link">
        <app-icon name="key" />
        Sign in
      </a>
    }
  </nav>
  @if (navError()) {
    <p class="nav-error" role="alert">{{ navError() }}</p>
  }
  <main id="main-content" class="app-main" tabindex="-1">
    <router-outlet />
  </main>
</div>
<app-form-submit-overlay />
