<section class="page">
  <h1>Home</h1>
  @if (auth.currentUser(); as user) {
    <div class="panel stack">
      <p>
        You are signed in as <strong>{{ user.username }}</strong
        >.
      </p>
      <p class="muted">Account created {{ user.createdUtc | instantDate: user.timeZoneId }}.</p>
      <div class="actions">
        <a class="button" routerLink="/profile">Edit profile</a>
        <a class="button-secondary" [routerLink]="['/users', user.username]">View public profile</a>
      </div>
    </div>
  }
</section>
