<section class="page">
  <h1>Reset password</h1>
  <form class="panel stack" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    @if (errorMessages().length > 0) {
      <div #formAlert class="error error-banner" role="alert" tabindex="-1">
        @for (message of errorMessages(); track $index) {
          <p>{{ message }}</p>
        }
      </div>
    }
    <div class="field" [class.invalid]="isInvalid('password')">
      <label for="password">New password <span class="required-marker" aria-hidden="true">*</span></label>
      <input
        id="password"
        type="password"
        autocomplete="new-password"
        formControlName="password"
        aria-required="true"
      />
      <p class="muted">At least 12 characters, with upper, lower, a number, and a special character.</p>
    </div>
    <div class="field" [class.invalid]="isInvalid('confirmPassword')">
      <label for="confirmPassword">Confirm password <span class="required-marker" aria-hidden="true">*</span></label>
      <input
        id="confirmPassword"
        type="password"
        autocomplete="new-password"
        formControlName="confirmPassword"
        aria-required="true"
      />
    </div>
    <div class="actions">
      <button class="button" type="submit" [disabled]="submitting()">Update password</button>
    </div>
    <p><a routerLink="/login">Back to sign in</a></p>
  </form>
</section>
