<section class="page">
  <h1>Reset password</h1>
  <form class="panel stack" [formGroup]="form" (ngSubmit)="submit()">
    @if (errorMessage()) {
      <p class="error" role="alert">{{ errorMessage() }}</p>
    }
    <div class="field">
      <label for="password">New password</label>
      <input id="password" type="password" autocomplete="new-password" formControlName="password" />
    </div>
    <div class="actions">
      <button class="button" type="submit" [disabled]="submitting()">Update password</button>
    </div>
    <p><a routerLink="/login">Back to sign in</a></p>
  </form>
</section>
