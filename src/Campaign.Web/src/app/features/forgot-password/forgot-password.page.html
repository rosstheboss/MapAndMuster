<section class="page">
  <h1>Forgot password</h1>
  <form class="panel stack" [formGroup]="form" (ngSubmit)="submit()">
    @if (errorMessage()) {
      <p class="error" role="alert">{{ errorMessage() }}</p>
    }
    @if (submitted()) {
      <p role="status">If that email is registered, a reset link is on its way.</p>
    } @else {
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" formControlName="email" />
      </div>
      <div class="actions">
        <button class="button" type="submit" [disabled]="submitting()">Send reset link</button>
      </div>
    }
    <p><a routerLink="/login">Back to sign in</a></p>
  </form>
</section>
