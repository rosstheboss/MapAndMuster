services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: mapandmuster
      POSTGRES_USER: mapandmuster
      POSTGRES_PASSWORD: mapandmuster
    ports:
      - "5432:5432"
    volumes:
      - mapandmuster-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mapandmuster -d mapandmuster"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  mapandmuster-postgres:
