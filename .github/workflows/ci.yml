name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('global.json', 'Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - run: dotnet restore MapAndMuster.sln
      - run: dotnet format MapAndMuster.sln --verify-no-changes --no-restore
      - run: dotnet build MapAndMuster.sln --configuration Release --no-restore
      - run: dotnet test MapAndMuster.sln --configuration Release --no-build --collect:"XPlat Code Coverage"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/MapAndMuster.Web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: src/MapAndMuster.Web/.nvmrc
          cache: npm
          cache-dependency-path: src/MapAndMuster.Web/package-lock.json
      - run: npm ci
      - run: npm run verify

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build API image
        run: docker build -f src/MapAndMuster.Api/Dockerfile -t mapandmuster-api:ci .
      # No Worker image: background work (email outbox) runs inside MapAndMuster.Api. See docs/adr/0003-production-hosting-stack.md.

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: mapandmuster
          POSTGRES_USER: mapandmuster
          POSTGRES_PASSWORD: mapandmuster
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mapandmuster -d mapandmuster"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('global.json', 'Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - name: Apply migrations to an empty database
        env:
          ConnectionStrings__Campaign: Host=localhost;Port=5432;Database=mapandmuster;Username=mapandmuster;Password=mapandmuster
        run: |
          chmod +x eng/build-migrations.sh eng/run-migrations.sh
          ./eng/build-migrations.sh
          ./eng/run-migrations.sh

  end-to-end:
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v6
        with:
          node-version-file: src/MapAndMuster.Web/.nvmrc
          cache: npm
          cache-dependency-path: |
            src/MapAndMuster.Web/package-lock.json
            tests/MapAndMuster.Web.E2E/package-lock.json
      - run: npm ci
        working-directory: src/MapAndMuster.Web
      - run: npm ci
        working-directory: tests/MapAndMuster.Web.E2E
      - run: npx playwright install --with-deps
        working-directory: tests/MapAndMuster.Web.E2E
      - run: npm test
        working-directory: tests/MapAndMuster.Web.E2E
        env:
          CI: true
