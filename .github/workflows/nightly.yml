name: Nightly

on:
  schedule:
    # Approximately 02:00 America/Indiana/Indianapolis during EDT (UTC-4).
    # During EST this is 01:00 local. GitHub Actions cron is UTC-only.
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v6
        with:
          node-version-file: src/MapAndMuster.Web/.nvmrc
          cache: npm
          cache-dependency-path: |
            src/MapAndMuster.Web/package-lock.json
            tests/MapAndMuster.Web.E2E/package-lock.json
      - name: Restore with high and critical NuGet audit
        run: >-
          dotnet restore MapAndMuster.sln
          /p:NuGetAudit=true
          /p:NuGetAuditMode=all
          /p:NuGetAuditLevel=high
          /p:WarningsAsErrors=NU1903%3BNU1904
      - name: List known vulnerable .NET packages
        run: dotnet list MapAndMuster.sln package --vulnerable --include-transitive
      - name: npm audit (web)
        working-directory: src/MapAndMuster.Web
        run: |
          npm ci
          bash ../../eng/npm-audit.sh
      - name: npm audit (e2e)
        working-directory: tests/MapAndMuster.Web.E2E
        run: |
          npm ci
          bash ../../eng/npm-audit.sh
