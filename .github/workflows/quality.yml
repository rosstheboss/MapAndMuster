name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore Campaign.sln
      - run: dotnet format Campaign.sln --verify-no-changes --no-restore
      - run: dotnet build Campaign.sln --configuration Release --no-restore
      - run: dotnet test Campaign.sln --configuration Release --no-build --collect:"XPlat Code Coverage"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Campaign.Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: src/Campaign.Web/.nvmrc
          cache: npm
          cache-dependency-path: src/Campaign.Web/package-lock.json
      - run: npm ci
      - run: npm run verify

  end-to-end:
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: src/Campaign.Web/.nvmrc
          cache: npm
          cache-dependency-path: |
            src/Campaign.Web/package-lock.json
            tests/Campaign.Web.E2E/package-lock.json
      - run: npm ci
        working-directory: src/Campaign.Web
      - run: npm ci
        working-directory: tests/Campaign.Web.E2E
      - run: npx playwright install --with-deps
        working-directory: tests/Campaign.Web.E2E
      - run: npm test
        working-directory: tests/Campaign.Web.E2E
